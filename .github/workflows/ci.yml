name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: ${{ matrix.build_type }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        build_type: [ Debug, Release ]

    env:
      CC: clang
      CXX: clang++

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      # Catch2 is pulled in by FetchContent; cache it so most runs skip the clone
      # and rebuild. Keyed on the file that pins the tag.
      - name: Cache Catch2
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-${{ matrix.build_type }}-deps-${{ hashFiles('tests/CMakeLists.txt') }}

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build

      # Debug carries -fsanitize=address,undefined, so this run is also the
      # sanitizer pass.
      - name: Test
        run: ctest --test-dir build --build-config ${{ matrix.build_type }} --output-on-failure
